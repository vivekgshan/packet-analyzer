# -------------------- NAMESPACE --------------------
apiVersion: v1
kind: Namespace
metadata:
  name: packetanalyzer

---
# -------------------- POSTGRES DB --------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: packetanalyzer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: "packetuser"
            - name: POSTGRES_PASSWORD
              value: "packetpass"
            - name: POSTGRES_DB
              value: "packetdb"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: packetanalyzer
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432

---
# -------------------- PGADMIN --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@admin.com"
            - name: PGADMIN_DEFAULT_PASSWORD
              value: "admin"
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: packetanalyzer
spec:
  type: LoadBalancer
  selector:
    app: pgadmin
  ports:
    - port: 5050
      targetPort: 80

---
# -------------------- PERSISTOR SERVICE --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistor-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persistor-service
  template:
    metadata:
      labels:
        app: persistor-service
    spec:
      containers:
        - name: persistor-service
          image: ramanji9550/persistor-service:latest
          env:
            - name: SERVICE_PORT
              value: "5002"
            - name: DATABASE_URL
              value: "postgresql://packetuser:packetpass@db:5432/packetdb"
          ports:
            - containerPort: 5002

---
apiVersion: v1
kind: Service
metadata:
  name: persistor-service
  namespace: packetanalyzer
spec:
  selector:
    app: persistor-service
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP

---
# -------------------- PARSER SERVICE --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parser-service
  template:
    metadata:
      labels:
        app: parser-service
    spec:
      containers:
        - name: parser-service
          image: ramanji9550/parser-service:latest
          env:
            - name: SERVICE_PORT
              value: "5001"
            - name: DATABASE_URL
              value: "postgresql://packetuser:packetpass@db:5432/packetdb"
            - name: PERSISTOR_URL
              value: "http://persistor-service:5002"
          ports:
            - containerPort: 5001

---
apiVersion: v1
kind: Service
metadata:
  name: parser-service
  namespace: packetanalyzer
spec:
  type: ClusterIP
  selector:
    app: parser-service
  ports:
    - port: 5001
      targetPort: 5001

---
# -------------------- ANALYZER SERVICE --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyzer-service
  template:
    metadata:
      labels:
        app: analyzer-service
    spec:
      containers:
        - name: analyzer-service
          image: ramanji9550/analyzer-service:latest
          env:
            - name: SERVICE_PORT
              value: "5003"
            - name: DATABASE_URL
              value: "postgresql://packetuser:packetpass@db:5432/packetdb"
          ports:
            - containerPort: 5003

---
apiVersion: v1
kind: Service
metadata:
  name: analyzer-service
  namespace: packetanalyzer
spec:
  selector:
    app: analyzer-service
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP

---
# -------------------- UI SERVICE --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
        - name: ui-service
          image: ramanji9550/ui-service:latest
          env:
            - name: SERVICE_PORT
              value: "5000"
            - name: ANALYZER_URL
              value: "http://analyzer-service:5003"
            - name: CAPTURE_URL
              value: "http://capture-service:5004"
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: packetanalyzer
spec:
  type: LoadBalancer
  selector:
    app: ui-service
  ports:
    - port: 5000
      targetPort: 5000

---
# -------------------- CAPTURE SERVICE (DaemonSet) --------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: capture-service
  namespace: packetanalyzer
  labels:
    app: capture-service
spec:
  selector:
    matchLabels:
      app: capture-service
  template:
    metadata:
      labels:
        app: capture-service
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: capture-service
          image: ramanji9550/capture-service:latest  # 🔁 Replace with your image name
          imagePullPolicy: Always
          securityContext:
            privileged: true
          ports:
            - containerPort: 5004
              name: http
          env:
            - name: SERVICE_PORT
              value: "5004"
            - name: PARSER_URL
              value: "http://parser-service.packetanalyzer.svc.cluster.local:5001"
            - name: HOST_IFACE
              value: "enp39s0"
            - name: POD_IFACE
              value: "eth0"
          volumeMounts:
            - name: host-sys-net
              mountPath: /host-sys
              readOnly: true
            - name: resolv-conf
              mountPath: /etc/resolv.conf
              readOnly: true
      volumes:
        - name: host-sys-net
          hostPath:
            path: /sys/class/net           # ✅ Mount host network interfaces
            type: Directory
        - name: resolv-conf
          hostPath:
            path: /etc/resolv.conf
            type: File
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule


---
apiVersion: v1
kind: Service
metadata:
  name: capture-service
  namespace: packetanalyzer
  labels:
    app: capture-service
spec:
  selector:
    app: capture-service
  ports:
    - port: 5004
      targetPort: 5004
  type: ClusterIP

