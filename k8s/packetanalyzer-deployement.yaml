apiVersion: v1
kind: Namespace
metadata:
  name: packetanalyzer
---
# ================== PostgreSQL DB ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: packetuser
            - name: POSTGRES_PASSWORD
              value: packetpass
            - name: POSTGRES_DB
              value: packetdb
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-storage
          emptyDir: {}   # ✅ Use PVC for production
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: packetanalyzer
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: db
---
# ================== PGAdmin ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@admin.com
            - name: PGADMIN_DEFAULT_PASSWORD
              value: admin
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: packetanalyzer
spec:
  type: LoadBalancer
  ports:
    - port: 5050
      targetPort: 80
  selector:
    app: pgadmin
---
# ================== Persistor Service ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistor-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persistor-service
  template:
    metadata:
      labels:
        app: persistor-service
    spec:
      containers:
        - name: persistor-service
          image: ramanji9550/persistor-service:latest
          ports:
            - containerPort: 5002
          env:
            - name: SERVICE_PORT
              value: "5002"
            - name: DATABASE_URL
              value: "postgresql://packetuser:packetpass@db:5432/packetdb"
---
apiVersion: v1
kind: Service
metadata:
  name: persistor-service
  namespace: packetanalyzer
spec:
  ports:
    - port: 5002
      targetPort: 5002
  selector:
    app: persistor-service
---
# ================== Parser Service ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parser-service
  template:
    metadata:
      labels:
        app: parser-service
    spec:
      containers:
        - name: parser-service
          image: ramanji9550/parser-service:latest
          ports:
            - containerPort: 5001
          env:
            - name: SERVICE_PORT
              value: "5001"
            - name: DATABASE_URL
              value: "postgresql://packetuser:packetpass@db:5432/packetdb"
---
apiVersion: v1
kind: Service
metadata:
  name: parser-service
  namespace: packetanalyzer
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: parser-service
---
# ================== Analyzer Service ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyzer-service
  template:
    metadata:
      labels:
        app: analyzer-service
    spec:
      containers:
        - name: analyzer-service
          image: ramanji9550/analyzer-service:latest
          ports:
            - containerPort: 5003
          env:
            - name: SERVICE_PORT
              value: "5003"
            - name: DATABASE_URL
              value: "postgresql://packetuser:packetpass@db:5432/packetdb"
---
apiVersion: v1
kind: Service
metadata:
  name: analyzer-service
  namespace: packetanalyzer
spec:
  ports:
    - port: 5003
      targetPort: 5003
  selector:
    app: analyzer-service
---
# ================== UI Service ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
        - name: ui-service
          image: ramanji9550/ui-service:latest
          ports:
            - containerPort: 5000
          env:
            - name: SERVICE_PORT
              value: "5000"
            - name: ANALYZER_URL
              value: "http://analyzer-service:5003"
            - name: CAPTURE_URL
              value: "http://capture-service:5004"
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: packetanalyzer
spec:
  type: LoadBalancer
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: ui-service
---
# ================== Capture Service ==================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture-service
  namespace: packetanalyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capture-service
  template:
    metadata:
      labels:
        app: capture-service
    spec:
      containers:
        - name: capture-service
          image: ramanji9550/capture-service:latest
          ports:
            - containerPort: 5004
          env:
            - name: SERVICE_PORT
              value: "5004"
          securityContext:     # ✅ needed for sniffing
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - mountPath: /var/run/docker.sock
              name: docker-sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: capture-service
  namespace: packetanalyzer
spec:
  ports:
    - port: 5004
      targetPort: 5004
  selector:
    app: capture-service
